server:
  port: 8060
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: hos-cockpit-screen-api

  datasource:
    url: jdbc:postgresql://119.167.165.27:5432/zjylzl?currentSchema=zjylzl
    username: postgres
    password: zjylzl
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 180000

  redis:
    host: 81.71.44.180
    port: 6379
    database: 1
    timeout: 3000
    connect-timeout: 3000
    lettuce:
      pool:
        max-wait: 3000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  level:
    com.kxhospital.cockpit: DEBUG
    root: INFO
